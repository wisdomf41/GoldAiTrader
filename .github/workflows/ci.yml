name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Public CI: restore, build, and test the .NET solution on every push and pull request.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GoldAiTrader.slnx

      - name: Build
        run: dotnet build GoldAiTrader.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GoldAiTrader.slnx --configuration Release --no-build --verbosity normal
